services:
  mysql:
    image: mysql:8.0
    container_name: masterconnect_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: masterconnect_root
      MYSQL_DATABASE: masterconnect
      MYSQL_USER: masterconnect_user
      MYSQL_PASSWORD: masterconnect_pass
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci

  adminer:
    image: adminer:latest
    container_name: masterconnect_adminer
    restart: unless-stopped
    ports:
      - "8081:8080"
    environment:
      ADMINER_DEFAULT_SERVER: mysql
      ADMINER_DESIGN: pepa-linha
    depends_on:
      - mysql

volumes:
  mysql_data:
    driver: local
