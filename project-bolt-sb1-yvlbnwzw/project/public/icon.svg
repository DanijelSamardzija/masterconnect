<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FF8C00;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#CC4400;stop-opacity:1" />
    </linearGradient>

    <linearGradient id="mGradient" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F0F0F0;stop-opacity:1" />
    </linearGradient>

    <linearGradient id="highlightGradient" x1="50%" y1="0%" x2="50%" y2="40%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:0.4" />
      <stop offset="100%" style="stop-color:#FFFFFF;stop-opacity:0" />
    </linearGradient>

    <linearGradient id="shadowGradient" x1="50%" y1="80%" x2="50%" y2="100%">
      <stop offset="0%" style="stop-color:#000000;stop-opacity:0" />
      <stop offset="100%" style="stop-color:#000000;stop-opacity:0.2" />
    </linearGradient>

    <filter id="outerShadow">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.25"/>
    </filter>

    <filter id="letterShadow">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#000000" flood-opacity="0.2"/>
    </filter>
  </defs>

  <rect x="32" y="32" width="448" height="448" rx="128" fill="url(#bgGradient)" filter="url(#outerShadow)"/>

  <g filter="url(#letterShadow)">
    <path d="M 140 360 L 140 160 L 185 160 L 235 265 L 256 225 L 277 265 L 327 160 L 372 160 L 372 360 L 330 360 L 330 230 L 290 310 L 256 250 L 222 310 L 182 230 L 182 360 Z"
          fill="url(#mGradient)"
          stroke="none"/>
  </g>

  <path d="M 140 160 L 185 160 L 235 265 L 256 225 L 277 265 L 327 160 L 372 160 L 372 200 L 330 200 L 290 260 L 256 210 L 222 260 L 182 200 L 140 200 Z"
        fill="url(#highlightGradient)"/>

  <path d="M 140 320 L 140 360 L 182 360 L 182 320 L 222 320 L 256 280 L 290 320 L 330 320 L 330 360 L 372 360 L 372 320 Z"
        fill="url(#shadowGradient)"/>
</svg>
