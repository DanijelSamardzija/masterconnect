<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clear Supabase Storage</title>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            max-width: 600px;
            margin: 50px auto;
            padding: 20px;
            background: #f5f5f5;
        }
        .card {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        h1 {
            color: #ff6b35;
            margin-top: 0;
        }
        button {
            background: #ff6b35;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 20px;
        }
        button:hover {
            background: #e55a2b;
        }
        #result {
            margin-top: 20px;
            padding: 15px;
            border-radius: 8px;
            display: none;
        }
        .success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        .info {
            background: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
        }
        pre {
            background: #f8f9fa;
            padding: 10px;
            border-radius: 4px;
            overflow-x: auto;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>🧹 Clear Supabase Storage</h1>
        <p>This will clear ALL localStorage, sessionStorage, and cookies including any old Supabase auth tokens that might be causing 429 rate limit errors.</p>

        <button onclick="clearEverything()">Clear All Storage & Cookies</button>

        <div id="result"></div>
    </div>

    <script>
        function clearEverything() {
            const result = document.getElementById('result');
            result.style.display = 'block';
            result.className = 'info';

            const clearedItems = [];

            // Clear localStorage
            const localStorageKeys = Object.keys(localStorage);
            clearedItems.push(`LocalStorage (${localStorageKeys.length} items):`);
            localStorageKeys.forEach(key => {
                clearedItems.push(`  - ${key}`);
            });
            localStorage.clear();

            // Clear sessionStorage
            const sessionStorageKeys = Object.keys(sessionStorage);
            clearedItems.push(`\nSessionStorage (${sessionStorageKeys.length} items):`);
            sessionStorageKeys.forEach(key => {
                clearedItems.push(`  - ${key}`);
            });
            sessionStorage.clear();

            // Clear cookies
            const cookies = document.cookie.split(";");
            clearedItems.push(`\nCookies (${cookies.length} items):`);
            for (let i = 0; i < cookies.length; i++) {
                const cookie = cookies[i];
                const eqPos = cookie.indexOf("=");
                const name = eqPos > -1 ? cookie.substr(0, eqPos).trim() : cookie.trim();
                clearedItems.push(`  - ${name}`);
                document.cookie = name + "=;expires=Thu, 01 Jan 1970 00:00:00 GMT;path=/";
                document.cookie = name + "=;expires=Thu, 01 Jan 1970 00:00:00 GMT;path=/;domain=" + window.location.hostname;
            }

            result.innerHTML = `
                <strong>✅ Successfully cleared:</strong>
                <pre>${clearedItems.join('\n')}</pre>
                <p><strong>Next steps:</strong></p>
                <ol>
                    <li>Close this tab</li>
                    <li>Go to the login page</li>
                    <li>Wait for any rate limit cooldown to expire</li>
                    <li>Try logging in again</li>
                </ol>
            `;
            result.className = 'success';
        }
    </script>
</body>
</html>
